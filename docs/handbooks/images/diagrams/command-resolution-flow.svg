<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1040" font-family="Helvetica, Arial, sans-serif">
  <title>How a typed command resolves to an executed action</title>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7c"/>
    </marker>
    <marker id="arrow2d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a97a6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="1040" fill="#f4f6f8"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#2b3440">Command resolution</text>

  <!-- 1 -->
  <rect x="300" y="60" width="300" height="60" rx="10" fill="#2b3440"/>
  <text x="450" y="96" text-anchor="middle" font-size="14" fill="#fff">Player types a command</text>
  <line x1="450" y1="120" x2="450" y2="155" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 2 -->
  <rect x="250" y="160" width="400" height="60" rx="10" fill="#3d6b8c"/>
  <text x="450" y="196" text-anchor="middle" font-size="14" fill="#fff">Match verb / adjective / noun against vocabulary</text>
  <line x1="450" y1="220" x2="450" y2="255" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 3 decision -->
  <polygon points="450,260 630,320 450,380 270,320" fill="#6b7686"/>
  <text x="450" y="315" text-anchor="middle" font-size="13" fill="#fff">Any command</text>
  <text x="450" y="332" text-anchor="middle" font-size="13" fill="#fff">chain matches?</text>

  <!-- no branch -->
  <line x1="630" y1="320" x2="720" y2="320" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="672" y="308" font-size="13" fill="#445063">no</text>
  <rect x="620" y="350" width="200" height="60" rx="10" fill="#8a3d3d"/>
  <text x="720" y="376" text-anchor="middle" font-size="13" fill="#fff">Nothing happens /</text>
  <text x="720" y="394" text-anchor="middle" font-size="13" fill="#fff">default response</text>
  <line x1="720" y1="320" x2="720" y2="350" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- yes branch down -->
  <line x1="450" y1="380" x2="450" y2="425" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="466" y="405" font-size="13" fill="#445063">yes</text>

  <!-- 4 -->
  <rect x="250" y="430" width="400" height="60" rx="10" fill="#3d6b8c"/>
  <text x="450" y="460" text-anchor="middle" font-size="14" fill="#fff">Take the next variant in the</text>
  <text x="450" y="478" text-anchor="middle" font-size="14" fill="#fff">Command Chain, in order</text>
  <line x1="450" y1="490" x2="450" y2="525" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 5 decision -->
  <polygon points="450,530 630,600 450,670 270,600" fill="#6b7686"/>
  <text x="450" y="595" text-anchor="middle" font-size="13" fill="#fff">Do all of this variant's</text>
  <text x="450" y="612" text-anchor="middle" font-size="13" fill="#fff">preconditions pass?</text>

  <!-- no -> loop back to step 4 -->
  <line x1="630" y1="600" x2="730" y2="600" stroke="#5b6b7c" stroke-width="2"/>
  <text x="672" y="588" font-size="13" fill="#445063">no</text>
  <path d="M730,600 L730,445 L652,445" fill="none" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="742" y="500" font-size="12" fill="#445063">try the next</text>
  <text x="742" y="516" font-size="12" fill="#445063">variant</text>

  <!-- no variants left annotation -->
  <line x1="730" y1="600" x2="730" y2="632" stroke="#8a97a6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow2d)"/>
  <rect x="635" y="636" width="190" height="72" rx="10" fill="#eef2f5" stroke="#8a97a6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="730" y="664" text-anchor="middle" font-size="12" fill="#2b3440">If no variant's</text>
  <text x="730" y="682" text-anchor="middle" font-size="12" fill="#2b3440">preconditions ever pass,</text>
  <text x="730" y="700" text-anchor="middle" font-size="12" fill="#2b3440">the command doesn't fire</text>

  <!-- yes down -->
  <line x1="450" y1="670" x2="450" y2="810" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="466" y="740" font-size="13" fill="#445063">yes</text>

  <!-- 6 -->
  <rect x="250" y="815" width="400" height="60" rx="10" fill="#3d6b8c"/>
  <text x="450" y="845" text-anchor="middle" font-size="14" fill="#fff">Run this variant's Actions,</text>
  <text x="450" y="863" text-anchor="middle" font-size="14" fill="#fff">in order</text>
  <line x1="450" y1="875" x2="450" y2="910" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 7 -->
  <rect x="300" y="915" width="300" height="60" rx="10" fill="#2b3440"/>
  <text x="450" y="951" text-anchor="middle" font-size="14" fill="#fff">Turn complete</text>

  <text x="450" y="1015" text-anchor="middle" font-size="12" fill="#6b7686">All preconditions on a variant are combined with AND. Negate a row to flip it.</text>
</svg>
